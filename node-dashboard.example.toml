# Node Dashboard configuration
# Copy this file to node-dashboard.toml and adjust it.

# Port to listen on
port = 8080

# Node exporter base URLs; /metrics is appended automatically.
# At least one node exporter or Prometheus source is required.
node_exporters = [
  "http://localhost:9100",
]

# Prometheus servers whose node_exporter targets are shown as well. Their data is
# read from Prometheus, current values and history, and not stored by the dashboard.
# Repeat the block for several servers.
#[[prometheus]]
#url = "http://localhost:9090"
# Optional label matchers limiting the targets
#selector = 'job="node"'
# Window for rate() in seconds, must cover at least two scrapes (default 120)
#rate_interval = 120

# Dashboard update frequency in seconds
update_frequency = 10

# Node exporter data fetch frequency in seconds
data_fetch_frequency = 5

# Directory for the metrics history database
data_dir = "./data"

# Number of days to keep metrics history
retention_days = 30

# Basic authentication; user and password are required when enabled
[auth]
enabled = false
user = ""
password = ""
